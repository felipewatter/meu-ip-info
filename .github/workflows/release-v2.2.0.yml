name: Publish Meu IP Info v2.2.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.2.0.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified WordPress plugin release
    if: github.repository == 'felipewatter/meu-ip-info'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify release commit and notes
        env:
          RELEASE_COMMIT: 498f3fef6969b21557e8974b1b61215c1ee0edf2
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          test -s .github/release-notes/v2.2.0.md
          test "$(git show "$RELEASE_COMMIT:meu-ip-info.php" | grep -c 'Version: 2.2.0')" -eq 1

      - name: Create official stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 498f3fef6969b21557e8974b1b61215c1ee0edf2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v2.2.0 already exists; will not replace it."
            exit 0
          fi
          gh release create v2.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Meu IP Info v2.2.0 — Privacy & Security Hardening" \
            --notes-file .github/release-notes/v2.2.0.md \
            --latest
